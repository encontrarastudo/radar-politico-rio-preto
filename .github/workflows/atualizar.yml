name: Atualizar site (coleta diária)

# Roda todo dia de madrugada e também sob demanda.
# Minuto "quebrado" (:43) e hora de baixo tráfego para reduzir o atraso da fila do GitHub Actions.
on:
  schedule:
    - cron: "43 6 * * *"   # 06:43 UTC = 03:43 BRT (madrugada, fora de pico)
  workflow_dispatch:
    inputs:
      backfill:
        description: "1 para varrer o histórico (backfill)"
        required: false
        default: ""
      dias:
        description: "Janela em dias (padrão 150)"
        required: false
        default: ""
      max_pag:
        description: "Páginas por tipo (padrão 90)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPOSTAS_BACKFILL: ${{ github.event.inputs.backfill }}
      PROPOSTAS_DIAS: ${{ github.event.inputs.dias }}
      PROPOSTAS_MAX_PAG: ${{ github.event.inputs.max_pag }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Se a coleta vier incompleta ou estranha, este passo FALHA (exit != 0).
      # Como ele falha, os passos seguintes não rodam e NADA é publicado:
      # o site continua na última versão boa.
      - name: Coletar dados oficiais e validar
        run: python tools/collector.py

      - name: Reconstruir o site
        run: python tools/build.py

      - name: Publicar se houver mudança
        run: |
          git config user.name "radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados hoje."
          else
            git commit -m "Atualização automática dos dados ($(date -u +%F))"
            git push || (git pull --rebase -X ours origin main && git push)
          fi
